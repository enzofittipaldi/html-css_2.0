<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio Grid Layout</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: 80px 50px 200px 50px;
            grid-template-columns: auto 150px;
            gap: 5px;
        }

        .item1{
            background-color: red;
            grid-row: 1 / 2;
            grid-column: 1 / 3;
            text-align: center;
            padding-top: 25px;
        }

        .item2{
            background-color: blue;
            grid-row: 2 / 3;
            grid-column: 1 / 3;
            text-align: center;
            padding-top: 15px;
        }

        .item3{
            background-color: green;
            grid-row: 3 / 4;
            grid-column: 1 / 2;
            text-align: center;
            padding-top: 100px;
        }

        .item4{
            background-color: purple;
            grid-row: 3 / 4;
            grid-column: 2 / 3;
            text-align: center;
            padding-top: 75px;
        }

        .item5{
            background-color: yellow;
            grid-row: 4 / 5;
            grid-column: 1 / 3;
            text-align: center;
            padding-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">topo</div>
        <div class="item2">menu</div>
        <div class="item3">principal</div>
        <div class="item4">secundario</div>
        <div class="item5">rodape</div>
    </div>
</body>
</html>
