<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex009</title>
</head>
<style>
    div.conteiner{
        background-color: lightcoral;

        display: flex;
        flex-flow: row nowrap;
    }

    div.item{
        background-color: lightblue;
        border: 1px solid black;
        text-align: center;
    }

    div#item1{
        flex-basis: 300px;
        flex-grow: 0;
        flex-shrink: 1;
    }

    div#item2{
        flex-basis: 300px;
        flex-grow: 2;
        flex-shrink: 0;
    }

    div#item3{
        flex-basis: 300px;
        flex-grow: 1;
        flex-shrink: 2;
    }
</style>
<body>
    <div class="conteiner">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>
    </div>
</body>
</html>
