<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica flex003</title>
    <style>
        main.conteiner{
            background-color: blueviolet;
            height: 150px;
            display: flex;
            flex-flow: column wrap;
        }

        section.item{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            
            flex: auto;
        }
    </style>
</head>
<body>
    <main class="conteiner">
        <section class="item">Exemplo de Item A</section>
        <section class="item">Exemplo de Item B</section>
        <section class="item">Exemplo de Item C</section>
        <section class="item">Exemplo de Item D</section>
        <section class="item">Exemplo de Item E</section>
        <section class="item">Exemplo de Item F</section>
        <section class="item">Exemplo de Item G</section>
        <section class="item">Exemplo de Item H</section>
        <section class="item">Exemplo de Item I</section>
        <section class="item">Exemplo de Item J</section>
    </main>
</body>
</html>
