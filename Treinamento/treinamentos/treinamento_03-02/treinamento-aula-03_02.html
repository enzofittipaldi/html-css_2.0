<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento de formulario (03/04)</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>treinamento formulario (03/02)</h1>
    <fieldset>
        <form action="" method="post">
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required minlength="8" maxlength="30" placeholder="Nome">
            </p>
            <p>
                <label for="isobre">Sobrenome</label>
                <input type="text" name="sobre" id="isobre" required minlength="8" maxlength="30" placeholder="Sobrenome">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" required placeholder="E-mail" >
            </p>
            <p>
                <label for="isenha">senha</label>
                <input type="password" name="senha" id="isenha" required minlength="8" placeholder="Senha">
            </p>
            <p>
                <label for="ihora">Hora</label>
                <input type="time" name="hora" id="ihora" value="09:59">
            </p>
            <P>
                <label for="inote">note</label>
                <input type="number" name="note" id="inote" step="0.1" min="0" max="10">
            </P>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Apagar">
            </p>
        </form>
    </fieldset>
</body>
</html>
